name: borrowed-oracle-suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'qiskit>=2.1,<3' numpy pytest
      - name: Focused tests
        env:
          PYTHONPATH: src
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_post129_new_methods.py
      - name: Run bounded architecture suite
        env:
          PYTHONPATH: src
          OPENBLAS_NUM_THREADS: '1'
        shell: bash
        run: |
          mkdir -p artifacts/post129_new_methods_ci
          set +e
          for method in cofactor kg24 qrom mvi cst; do
            echo "===== $method ====="
            mkdir -p "artifacts/post129_new_methods_ci/$method"
            timeout 420s python src/post129_new_methods.py \
              --outdir "artifacts/post129_new_methods_ci/$method" \
              --methods "$method" \
              > "artifacts/post129_new_methods_ci/$method/stdout.log" 2>&1
            code=$?
            echo "$code" > "artifacts/post129_new_methods_ci/$method/exit_code.txt"
            cat "artifacts/post129_new_methods_ci/$method/stdout.log"
          done
          exit 0
      - name: Exhaustively verify emitted full oracles
        env:
          PYTHONPATH: src
          OPENBLAS_NUM_THREADS: '1'
        shell: bash
        run: |
          set +e
          while IFS= read -r qasm; do
            echo "===== verify $qasm ====="
            timeout 600s python src/exhaustive_verify.py "$qasm" \
              > "$qasm.verify.log" 2>&1
            code=$?
            echo "$code" > "$qasm.verify.exit_code.txt"
            cat "$qasm.verify.log"
          done < <(find artifacts/post129_new_methods_ci -name '*.qasm' -type f | sort)
          exit 0
      - name: Build summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python src/post129_new_methods_summary.py \
            --root artifacts/post129_new_methods_ci \
            --out artifacts/post129_new_methods_ci/SUMMARY.md
          cat artifacts/post129_new_methods_ci/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post129-new-methods
          path: artifacts/post129_new_methods_ci
          if-no-files-found: warn
