name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy matplotlib pytest
      - name: Exhaustive verification of the final and recent milestone circuits
        run: python scripts/verify_circuit.py artifacts/111/*.qasm artifacts/112/*.qasm artifacts/113/*.qasm artifacts/114/*.qasm artifacts/115/*.qasm artifacts/116/*.qasm submission/submission.qasm
      - name: Verifier tests
        run: python -m pytest -q tests/test_verify_circuit.py
      - name: Figures regenerate
        run: python scripts/make_figures.py
