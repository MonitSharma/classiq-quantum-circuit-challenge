[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classiq-logo-oracle"
version = "1.1.0"
description = "A depth-111, 18-qubit phase oracle for the Classiq logo, with exhaustive verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Monit Sharma" }
]
keywords = ["quantum-computing", "circuit-depth-optimization", "classiq", "qiskit", "synthesis"]

dependencies = [
    "classiq>=1.29.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pytket>=2.0.0",
    "z3-solver>=4.12.0",
    "pytest>=8.0.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["classiq_synth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
